<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="estilo.css">
    <script src="script/script.js"></script>
    </script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen transition-colors duration-300" id="body-container">

    <!-- Top Control Bar / Header -->
    <header class="sticky top-0 z-50 bg-white/90 dark:bg-slate-900/90 backdrop-blur border-b border-slate-200 dark:border-slate-800 px-4 py-3 shadow-sm">

        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            
            <div class="flex items-center gap-3">
                <div class="p-2 bg-blue-600 text-white rounded-lg shadow-sm">
                    <i data-lucide="layout"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-slate-900 dark:text-white leading-tight">Vinicius.Conceição</h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400">Portifolio Pessoal — Vinicius Conceição Alves Maria</p>
                </div>
            </div>

            <!-- View Switcher Controls -->
            <div class="flex flex-wrap items-center gap-2">
                <div class="bg-slate-100 dark:bg-slate-800 p-1 rounded-lg flex items-center border border-slate-200 dark:border-slate-700">
                    <button id="btn-style-wireframe" onclick="setStyle('wireframe')" class="px-3 py-1.5 rounded-md text-xs font-semibold flex items-center gap-1.5 transition-all bg-white dark:bg-slate-700 text-slate-800 dark:text-white shadow-sm">
                        <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
                        Sketch Wireframe
                    </button>
                    <button id="btn-style-blueprint" onclick="setStyle('blueprint')" class="px-3 py-1.5 rounded-md text-xs font-semibold flex items-center gap-1.5 transition-all text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">
                        <i data-lucide="compass" class="w-3.5 h-3.5"></i>
                        Blueprint Azul
                    </button>
                </div>
            </div>
        </div>

        <nav class="max-w-7xl mx-auto mt-3 pt-3 border-t border-slate-200 dark:border-slate-800">
            <ul class="flex flex-wrap items-center gap-1 text-sm">
                <li><a href="index.html" class="nav-link px-3 py-1.5 rounded-lg font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition flex items-center gap-1.5"><i data-lucide="user" class="w-3.5 h-3.5"></i> Sobre Mim</a></li>
                <li><a href="curriculo.html" class="nav-link px-3 py-1.5 rounded-lg font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition flex items-center gap-1.5"><i data-lucide="file-text" class="w-3.5 h-3.5"></i> Currículo</a></li>
                <li><a href="formulario.html" class="nav-link px-3 py-1.5 rounded-lg font-medium bg-blue-600 text-white shadow-sm flex items-center gap-1.5"><i data-lucide="mail" class="w-3.5 h-3.5"></i> Contato</a></li>
                <li><a href="multimidia.html" class="nav-link px-3 py-1.5 rounded-lg font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition flex items-center gap-1.5"><i data-lucide="sparkles" class="w-3.5 h-3.5"></i> Multimidia</a></li>
                <li><a href="grafico.html" class="nav-link px-3 py-1.5 rounded-lg font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition flex items-center gap-1.5"><i data-lucide="bar-chart-2" class="w-3.5 h-3.5"></i> Gráfico</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto p-4 md:p-8">
        <div id="wireframe-canvas" class="wireframe-grid bg-slate-50 border-2 border-dashed border-slate-300 rounded-2xl p-4 md:p-10 transition-all duration-300 min-h-[600px] relative">
            <div class="max-w-4xl mx-auto space-y-6">
                
                <!-- Bloco do Wireframe contendo o seu Formulário Exato -->
                <section class="wf-section relative group border-2 border-slate-400 border-dashed rounded-xl p-6 bg-white shadow-sm transition-all" id="wf-formulario">

                    <div class="flex items-center gap-2 border-b-2 border-slate-200 pb-2 mb-5">
                        <i data-lucide="mail" class="w-5 h-5 text-slate-500"></i>
                        <h1 class="text-xl font-bold text-slate-800 font-mono">Fale Comigo</h1>
                    </div>

                    <form class="space-y-6">
                        <fieldset class="border border-slate-200 rounded-lg p-4">
                            <legend class="text-sm font-bold text-slate-700 font-mono px-2">Dados Pessoais</legend>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-2">

                                <!-- FLEXBOX: cada campo é "flex flex-col" -> label em cima, input embaixo -->
                                <div class="flex flex-col gap-1">
                                    <label for="nome" class="text-sm font-medium text-slate-700">Nome:</label>
                                    <input type="text" id="nome" name="nome" class="border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                                </div>

                                <div class="flex flex-col gap-1">
                                    <label for="Nascimento" class="text-sm font-medium text-slate-700">Data de Nascimento:</label>
                                    <input type="date" id="Nascimento" name="nascimento" class="border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                                </div>

                                <div class="flex flex-col gap-1">
                                    <label for="email" class="text-sm font-medium text-slate-700">Email:</label>
                                    <input type="email" id="email" name="email" class="border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                                </div>

                                <div class="flex flex-col gap-1">
                                    <label for="assunto" class="text-sm font-medium text-slate-700">Assunto:</label>
                                    <input type="text" id="assunto" name="assunto" class="border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                                </div>

                                <div class="flex flex-col gap-1 md:col-span-2">
                                    <label for="contato" class="text-sm font-medium text-slate-700">Contato:</label>
                                    <input type="text" id="contato" name="contato" class="border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                                </div>
                            </div>
                        </fieldset>

                        <fieldset class="border border-slate-200 rounded-lg p-4">
                            <legend class="text-sm font-bold text-slate-700 font-mono px-2">Mensagem</legend>
                            <div class="flex flex-col gap-1 mt-2">
                                <label for="mensagem" class="text-sm font-medium text-slate-700">Mensagem:</label>
                                <input type="text" id="mensagem" name="mensagem" class="border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </div>
                        </fieldset>

                        <fieldset class="border border-slate-200 rounded-lg p-4">
                            <legend class="text-sm font-bold text-slate-700 font-mono px-2">Música Favorita</legend>
                            <div class="flex flex-col gap-1 mt-2">
                                <label for="musica" class="text-sm font-medium text-slate-700">Música Favorita:</label>
                                <input type="text" id="musica" name="musica" class="border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </div>
                        </fieldset>

                        <fieldset class="border border-slate-200 rounded-lg p-4">
                               <input type="submit" value="Enviar" class="w-full sm:w-auto cursor-pointer bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg px-6 py-2 text-sm transition">
                        </fieldset>
                    </form>

                </section>

            </div>
        </div>
    </main>

</body>
</html>
