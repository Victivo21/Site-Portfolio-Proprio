<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canva e SVG - Vinicius Conceição</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="grafico.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Fira Code', 'monospace'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen transition-colors duration-300" id="body-container">

    <!-- Top Control Bar / Header -->
    <header class="sticky top-0 z-50 bg-white/90 dark:bg-slate-900/90 backdrop-blur border-b border-slate-200 dark:border-slate-800 px-4 py-3 shadow-sm">

        <!--
          FLEXBOX (cabeçalho): mobile-first.
          Base (mobile): "flex flex-col" -> logo e controles empilhados.
          A partir de "md:" (>=768px): "md:flex-row" -> vira uma linha, com
          "justify-between" separando o bloco do logo do bloco de botões.
        -->
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            
            <div class="flex items-center gap-3">
                <div class="p-1.5 bg-blue-600 text-white rounded-md shadow-sm flex items-center justify-center">
                    <i data-lucide="layout" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-slate-900 dark:text-white leading-tight">Vinicius.Conceição</h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400">Portifolio Pessoal — Vinicius Conceição Alves Maria</p>
                </div>
            </div>

            <!-- View Switcher Controls -->
            <div class="flex flex-wrap items-center gap-2">
                <div class="bg-slate-100 dark:bg-slate-800 p-1 rounded-lg flex items-center border border-slate-200 dark:border-slate-700">
                    <button id="btn-style-wireframe" onclick="setStyle('wireframe')" class="px-3 py-1.5 rounded-md text-xs font-semibold flex items-center gap-1.5 transition-all bg-white dark:bg-slate-700 text-slate-800 dark:text-white shadow-sm">
                        <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
                        Sketch Wireframe
                    </button>
                    <button id="btn-style-blueprint" onclick="setStyle('blueprint')" class="px-3 py-1.5 rounded-md text-xs font-semibold flex items-center gap-1.5 transition-all text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">
                        <i data-lucide="compass" class="w-3.5 h-3.5"></i>
                        Blueprint Azul
                    </button>
                </div>
            </div>
        </div>

        <!--
          FLEXBOX (menu de navegação): "flex flex-wrap" mantém os itens
          alinhados em linha e, quando não cabem (telas pequenas),
          quebra automaticamente para a linha seguinte.
        -->
        <nav class="max-w-7xl mx-auto mt-3 pt-3 border-t border-slate-200 dark:border-slate-800">
            <ul class="flex flex-wrap items-center gap-1 text-sm">
                <li><a href="index.html" class="nav-link px-3 py-1.5 rounded-lg font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition flex items-center gap-1.5"><i data-lucide="user" class="w-3.5 h-3.5"></i> Sobre Mim</a></li>
                <li><a href="curriculo.html" class="nav-link px-3 py-1.5 rounded-lg font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition flex items-center gap-1.5"><i data-lucide="file-text" class="w-3.5 h-3.5"></i> Currículo</a></li>
                <li><a href="formulario.html" class="nav-link px-3 py-1.5 rounded-lg font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition flex items-center gap-1.5"><i data-lucide="mail" class="w-3.5 h-3.5"></i> Contato</a></li>
                <li><a href="multimidia.html" class="nav-link px-3 py-1.5 rounded-lg font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition flex items-center gap-1.5"><i data-lucide="sparkles" class="w-3.5 h-3.5"></i> Multimidia</a></li>
                <li><a href="grafico.html" class="nav-link px-3 py-1.5 rounded-lg font-medium bg-blue-600 text-white shadow-sm flex items-center gap-1.5"><i data-lucide="bar-chart-2" class="w-3.5 h-3.5"></i> Gráfico</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto p-4 md:p-8">
        <div id="wireframe-canvas" class="wireframe-grid bg-slate-50 border-2 border-dashed border-slate-300 rounded-2xl p-4 md:p-10 transition-all duration-300 min-h-[600px] relative">
            <div class="max-w-4xl mx-auto space-y-6">
                
                <!-- Bloco do Wireframe contendo o seu Conteúdo Exato de Canvas e SVG -->
                <section class="wf-section relative group border-2 border-slate-400 border-dashed rounded-xl p-6 bg-white shadow-sm transition-all" id="wf-grafico">
                    
                    <div class="grafico-wrapper">
                        <header class="grafico-header">
                            <h1>Canvas & SVG</h1>
                            <p class="sub">Demonstração simples e monocromática</p>
                        </header>

                        <!--
                          GRID (layout de 2+ colunas): mobile-first.
                          As classes Tailwind "grid grid-cols-1 md:grid-cols-2 gap-6" foram
                          somadas à classe original ".container" (do grafico.css).
                          Base (mobile): 1 coluna -> os cards de Canvas e SVG ficam empilhados.
                          A partir de "md:" (>=768px): 2 colunas -> os cards ficam lado a lado.
                        -->
                        <main class="container grid grid-cols-1 md:grid-cols-2 gap-6 items-start">
                            <!-- CARD 1: CANVAS -->
                            <section class="card">
                                <h2 class="card-title">01. Canvas (Gráfico de Linha)</h2>
                                <canvas id="meuCanvas" width="320" height="200"></canvas>
                            </section>

                            <!-- CARD 2: SVG -->
                            <section class="card">
                                <h2 class="card-title">02. SVG (Vetor com CSS)</h2>
                                <div class="svg-container">
                                    <svg viewBox="0 0 100 100">
                                        <!-- Círculo de fundo -->
                                        <circle class="svg-circle-bg" cx="50" cy="50" r="40" />
                                        
                                        <!-- Linha pontilhada animada via CSS -->
                                        <circle class="svg-orbit" cx="50" cy="50" r="30" />
                                        
                                        <!-- Elemento central -->
                                        <circle class="svg-center" cx="50" cy="50" r="10" />
                                        
                                        <!-- Ponto orbitando via CSS -->
                                        <circle class="svg-planet" cx="50" cy="50" r="4" />
                                    </svg>
                                </div>
                            </section>
                        </main>
                    </div>

                </section>

            </div>
        </div>
    </main>

    <!-- Script Original do Canvas -->
    <script>
        // DESENHO NO CANVAS (JavaScript simples)
        const canvas = document.getElementById('meuCanvas');
        const ctx = canvas.getContext('2d');

        // Dados simples para o gráfico
        const pontos = [30, 70, 45, 85, 60, 110, 90, 140];
        const espacamento = 320 / (pontos.length - 1);

        // 1. Linhas de grade sutis
        ctx.strokeStyle = '#f0f0f0';
        ctx.lineWidth = 1;
        for (let y = 40; y < 200; y += 40) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(320, y);
            ctx.stroke();
        }

        // 2. Desenha a linha principal
        ctx.beginPath();
        ctx.strokeStyle = '#111111';
        ctx.lineWidth = 2;

        pontos.forEach((val, i) => {
            const x = i * espacamento;
            const y = 200 - val; // Inverte o eixo Y
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        });
        ctx.stroke();

        // 3. Desenha os pontos (círculos)
        pontos.forEach((val, i) => {
            const x = i * espacamento;
            const y = 200 - val;

            ctx.beginPath();
            ctx.arc(x, y, 4, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.strokeStyle = '#111111';
            ctx.lineWidth = 2;
            ctx.stroke();
        });
    </script>

    <!-- Script de Alternância de Estilos (Sketch / Blueprint) -->
    <script>
        lucide.createIcons();

        let currentStyle = 'wireframe';

        function setStyle(style) {
            currentStyle = style;
            const canvas = document.getElementById('wireframe-canvas');
            const btnWireframe = document.getElementById('btn-style-wireframe');
            const btnBlueprint = document.getElementById('btn-style-blueprint');

            if (style === 'blueprint') {
                canvas.classList.remove('bg-slate-50', 'wireframe-grid', 'border-slate-300');
                canvas.classList.add('bg-slate-900', 'blueprint-grid', 'border-sky-800');
                
                document.querySelectorAll('#wireframe-canvas section.wf-section').forEach(sec => {
                    sec.classList.remove('bg-white', 'border-slate-400');
                    sec.classList.add('bg-slate-800', 'border-sky-500/50', 'text-slate-100');
                });

                btnBlueprint.className = 'px-3 py-1.5 rounded-md text-xs font-semibold flex items-center gap-1.5 transition-all bg-sky-500 text-white shadow-sm';
                btnWireframe.className = 'px-3 py-1.5 rounded-md text-xs font-semibold flex items-center gap-1.5 transition-all text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white';
            } else {
                canvas.classList.remove('bg-slate-900', 'blueprint-grid', 'border-sky-800');
                canvas.classList.add('bg-slate-50', 'wireframe-grid', 'border-slate-300');

                document.querySelectorAll('#wireframe-canvas section.wf-section').forEach(sec => {
                    sec.classList.remove('bg-slate-800', 'border-sky-500/50', 'text-slate-100');
                    sec.classList.add('bg-white', 'border-slate-400');
                });

                btnWireframe.className = 'px-3 py-1.5 rounded-md text-xs font-semibold flex items-center gap-1.5 transition-all bg-white dark:bg-slate-700 text-slate-800 dark:text-white shadow-sm';
                btnBlueprint.className = 'px-3 py-1.5 rounded-md text-xs font-semibold flex items-center gap-1.5 transition-all text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white';
            }
        }
    </script>
</body>
</html>
